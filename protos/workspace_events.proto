syntax = "proto3";
package proto.events;

message HierarchyElement {
  string uid = 1;
  string name = 2;
  string type = 3;
  bool enabled = 4;
  repeated HierarchyElement children = 5;
  bool is_prefab = 6;
  string prefab_uid = 7;
}

message UpdateHierarchyData {
  HierarchyElement root = 1;
  bool is_empty = 2;
  uint64 workspace_handle = 3;
}

message RequestHierarchyUpdate {}

message ReloadAssetsManifest {}

message WorkspaceCreate {
  string parent = 1;
  string type = 2;
}

message WorkspaceSpawn {
  string parent = 1;
  bool is_uri = 2;
  string uid = 3;
  string uri = 4;
}

message WorkspaceRemove {
  string target = 1;
}

message WorkspaceDestroy {
  uint64 handle = 1;
}

message SetActiveWorkspace {
  uint64 handle = 1;
}

message WorkspaceSave {
  string target = 1;
  string path = 2;
  uint64 workspace_handle = 3;
  uint64 request = 4;
}

message WorkspaceSaveCompleted {
  uint64 workspace_handle = 1;
  uint64 request = 2;
  bool success = 3;
  bytes snapshot = 4;
  string error = 5;
}

message WorkspaceAutosave {
  uint64 handle = 1;
  string path = 2;
}

message WorkspaceCreateNode {
  string parent = 1;
  string type = 2;
}

message WorkspaceRemoveNode {
  string target = 1;
}

message WorkspaceMoveNodeTo {
  string target = 1;
  string new_parent = 2;
  string predecessor = 3;
}

message SetFocusedNode {
  string node = 1;
}

message NodeChangeParam {
  string parameter = 1;
  string value = 2;
  string node = 3;
}

message NodeChangeName {
  string node = 1;
  string name = 2;
}

message NodeCallFunction {
  string function = 1;
  string node = 2;
}

message NodeEnabled {
  string node = 2;
  bool enabled = 3;
}

message NodeChangeType {
  string node = 1;
  string type = 2;
}

message WorkspaceDuplicateNode {
  string source = 1;
  string parent = 2;
}

message WorkspaceCopyNode {
  string source = 1;
}

message WorkspacePasteNode {
  string parent = 1;
}

message WorkspacePromoteNode {
  string target = 1;
  string path = 2;
}

message WorkspaceConvertToProceduralVoxel {
  string target = 1;
  string path = 2;
}

message ProceduralVoxelPromoted {
  uint64 workspace_handle = 1;
  string prefab_uid = 2;
  bool success = 3;
  string error = 4;
}

message VoxelInt3 {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
}

message VoxelPieceLayout {
  string uid = 1;
  string name = 2;
  uint32 kind = 3;
  VoxelInt3 min = 4;
  VoxelInt3 max = 5;
  float r = 6;
  float g = 7;
  float b = 8;
  repeated float planes = 9;
  bool resizable = 10;
  uint32 color_id = 11;
}

message ProceduralVoxelLayout {
  string root_uid = 1;
  repeated VoxelPieceLayout pieces = 2;
  string palette_uid = 3;
  repeated VoxelProjection projections = 4;
}

message VoxelProjection {
  sint32 min_h = 1;
  sint32 min_v = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes colors = 5;
  bytes depths = 6;
  bytes edges_h = 7;
  bytes edges_v = 8;
}

message VoxelSetPieceBounds {
  string target = 1;
  VoxelInt3 min = 2;
  VoxelInt3 max = 3;
}

message VoxelCreatePiece {
  string parent = 1;
  string type = 2;
  string source = 3;
  VoxelInt3 min = 4;
  VoxelInt3 max = 5;
  string script = 6;
}

message VoxelExtrude {
  string source = 1;
  VoxelInt3 min = 2;
  VoxelInt3 max = 3;
  bool inward = 4;
}

message VoxelSplitPieces {
  repeated string targets = 1;
  float nx = 2;
  float ny = 3;
  float nz = 4;
  float w = 5;
  uint32 keep = 6;
}

message VoxelRotatePieces {
  repeated string targets = 1;
  uint32 axis = 2;
  sint32 turns = 3;
}

message VoxelBucketFill {
  string target = 1;
  VoxelInt3 voxel = 2;
  uint32 id = 3;
  bool search = 4;
  uint32 search_axis = 5;
  sint32 search_step = 6;
}

message VoxelCollapsePieces {
  repeated string targets = 1;
  string path = 2;
}

message VoxelBake {
  string target = 1;
  string path = 2;
  bool replace = 3;
}

message VoxelBakeCompleted {
  string path = 1;
}

message SetVoxelEditorOverlays {
  bool unit_grid = 1;
  bool voxel_grid = 2;
  bool edges = 3;
  bool voxel_edges = 4;
  bool projections = 5;
}

message SetVoxelCutPreview {
  string root = 1;
  bool active = 2;
  float nx = 3;
  float ny = 4;
  float nz = 5;
  float w = 6;
}

message NodePicked {
  uint64 workspace_handle = 1;
  string node = 2;
}

message SetVoxelTool {
  uint32 tool = 1;
  uint32 paint_id = 2;
  string default_script = 3;
}

message SetShowOthers {
  bool show = 1;
  uint64 workspace = 2;
  uint64 source_workspace = 3;
  string source_instance = 4;
}

message WorkspacePause {
  uint64 handle = 1;
  bool paused = 2;
}

// 0 Select, 1 Translate, 2 Rotate, 3 Scale, 4 Ruler
message SetGizmoTool {
  uint32 tool = 1;
}

// 0 Lit, 1 ClusterHeatmap (clustered forward+ light-count-per-pixel debug view)
message SetRenderMode {
  uint32 mode = 1;
}

message SetCoordinateSpace {
  bool world = 1;
}

// kind: 0 translate, 1 rotate, 2 scale
message SetSnapping {
  uint32 kind = 1;
  bool enabled = 2;
  float value = 3;
}

message SetCameraMode {
  bool game = 1;
}

message EditorCameraFlyMode {
  bool active = 1;
}

// Requests a single RenderDoc frame capture around the next rendered frame; no-op if RenderDoc isn't attached
message CaptureFrame {}

message EditorCameraMoveState {
  bool forward = 1;
  bool back = 2;
  bool left = 3;
  bool right = 4;
  bool up = 5;
  bool down = 6;
  bool boost = 7;
}

message EditorCameraLook {
  float dx = 1;
  float dy = 2;
}

message SetEditorCameraSettings {
  enum Mode {
    FREE = 0;
    ORBIT = 1;
  }

  Mode mode = 1;
  float speed = 2;
  // Addressed explicitly rather than relying on the active workspace: the editor loads these settings
  // when the hierarchy first populates, which can land either side of the tab becoming active
  uint64 workspace_handle = 3;
}

// Trackpad gesture: dx/dy is a two-finger drag in pixels, zoom a pinch
message EditorCameraGesture {
  float dx = 1;
  float dy = 2;
  float zoom = 3;
}

message InspectorField {
  string name = 1;
  string value = 2;
}

message InspectorMessage {
  bool error = 1;
  string message = 2;
}

message InspectorContent {
  string name = 1;
  bool enabled = 2;
  repeated InspectorField parameters = 3;
  string uid = 4;
  repeated InspectorMessage messages = 5;
}

message LuaField {
  string path = 1;
  string name = 2;
  uint32 kind = 3;
  bool is_array = 4;
  string ref_type = 5;
  string value = 6;
  string default_value = 7;
}

message LuaSubgroup {
  string name = 1;
  repeated LuaField fields = 2;
}

message LuaGroup {
  string name = 1;
  repeated LuaField fields = 2;
  repeated LuaSubgroup subgroups = 3;
}

message LuaScriptCard {
  string script = 1;
  repeated LuaField fields = 2;
  repeated LuaGroup groups = 3;
}

message InspectorLuaContent {
  string uid = 1;
  uint32 schema_version = 2;
  repeated LuaScriptCard scripts = 3;
}

message NodeChangeLuaParam {
  string path = 1;
  string value = 2;
  string node = 3;
}

enum HistoryOperation {
  HISTORY_INITIAL = 0;
  HISTORY_CREATE = 1;
  HISTORY_DELETE = 2;
  HISTORY_RENAME = 3;
  HISTORY_ENABLE = 4;
  HISTORY_CHANGE_VALUE = 5;
  HISTORY_MOVE = 6;
  HISTORY_REPARENT = 7;
  HISTORY_RETYPE = 8;
  HISTORY_DUPLICATE = 9;
  HISTORY_SPAWN_PREFAB = 10;
  HISTORY_PASTE = 11;
  HISTORY_PROMOTE = 12;
  HISTORY_CALL_FUNCTION = 13;
  HISTORY_CHERRY_PICK = 14;
  HISTORY_MERGE = 15;
}

message HistoryRevision {
  uint64 id = 1;
  uint64 sequence = 2;
  repeated uint64 parents = 3;
  string node_uid = 4;
  string node_name = 5;
  HistoryOperation operation = 6;
  string subject = 7;
  string previous_value = 8;
  string current_value = 9;
}

message WorkspaceHistoryInitialSnapshot {
  uint64 workspace_handle = 1;
  bytes snapshot = 2;
  bool available = 3;
  bool initially_saved = 4;
  string unavailable_reason = 5;
}

message WorkspaceHistoryCommitted {
  uint64 workspace_handle = 1;
  bytes before_snapshot = 2;
  bytes after_snapshot = 3;
  string node_uid = 4;
  string node_name = 5;
  HistoryOperation operation = 6;
  string subject = 7;
  string previous_value = 8;
  string current_value = 9;
}

message WorkspaceApplyHistorySnapshot {
  uint64 workspace_handle = 1;
  uint64 request = 2;
  bytes snapshot = 3;
}

message WorkspaceHistorySnapshotApplied {
  uint64 workspace_handle = 1;
  uint64 request = 2;
  bool success = 3;
  string error = 4;
}

message WorkspacePrepareHistoryMerge {
  uint64 workspace_handle = 1;
  uint64 request = 2;
  bool is_merge = 3;
  bytes base_snapshot = 4;
  bytes current_snapshot = 5;
  bytes incoming_snapshot = 6;
}

message WorkspaceHistoryMergePrepared {
  uint64 workspace_handle = 1;
  uint64 request = 2;
  bool success = 3;
  bytes snapshot = 4;
  string error = 5;
}

message UpdateWorkspaceHistory {
  uint64 workspace_handle = 1;
  bool available = 2;
  string unavailable_reason = 3;
  uint64 current_revision = 4;
  bool is_dirty = 5;
  bool transaction_open = 6;
  repeated HistoryRevision revisions = 7;
}

message RequestWorkspaceHistory {
  uint64 workspace_handle = 1;
}

message WorkspaceUndo { uint64 workspace_handle = 1; }
message WorkspaceRedo { uint64 workspace_handle = 1; }

message WorkspaceCheckoutHistory {
  uint64 workspace_handle = 1;
  uint64 revision = 2;
}

message WorkspaceCherryPickHistory {
  uint64 workspace_handle = 1;
  uint64 revision = 2;
}

message WorkspaceMergeHistory {
  uint64 workspace_handle = 1;
  uint64 revision = 2;
}

message WorkspaceHistoryTransaction {
  uint64 workspace_handle = 1;
  uint64 transaction = 2;
  enum Phase {
    BEGIN = 0;
    COMMIT = 1;
    CANCEL = 2;
  }
  Phase phase = 3;
  HistoryOperation operation = 4;
  string node = 5;
  string subject = 6;
}

enum HistoryConflictKind {
  HISTORY_CONFLICT_VALUE = 0;
  HISTORY_CONFLICT_NAME = 1;
  HISTORY_CONFLICT_TYPE = 2;
  HISTORY_CONFLICT_ENABLED = 3;
  HISTORY_CONFLICT_PARENT = 4;
  HISTORY_CONFLICT_ORDER = 5;
  HISTORY_CONFLICT_EXISTENCE = 6;
  HISTORY_CONFLICT_LUA_VALUE = 7;
}

message HistoryConflict {
  uint64 id = 1;
  string node_uid = 2;
  string node_name = 3;
  HistoryConflictKind kind = 4;
  string field = 5;
  uint32 value_type = 6;
  bool is_array = 7;
  string ref_type = 8;
  string base_value = 9;
  string current_value = 10;
  string incoming_value = 11;
}

message WorkspaceHistoryConflicts {
  uint64 workspace_handle = 1;
  uint64 request = 2;
  bool is_merge = 3;
  uint64 source_revision = 4;
  repeated HistoryConflict conflicts = 5;
}

message HistoryConflictResolution {
  uint64 conflict = 1;
  enum Choice {
    BASE = 0;
    CURRENT = 1;
    INCOMING = 2;
    CUSTOM = 3;
  }
  Choice choice = 2;
  string custom_value = 3;
}

message WorkspaceResolveHistoryConflicts {
  uint64 workspace_handle = 1;
  uint64 request = 2;
  bool cancel = 3;
  repeated HistoryConflictResolution resolutions = 4;
}
